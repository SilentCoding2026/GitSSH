name: Run Minecraft Server
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  minecraft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove Java
        run: sudo apt-get remove -y --ignore-missing 'java*' 'openj*' || true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full jq openjdk-25-jre-headless
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          curl -fsSL https://raw.githubusercontent.com/filebrowser/get/master/get.sh | bash
          sudo npm install -g localtunnel

      - name: Restore or Initialize Server Directory
        run: |
          mkdir -p server
          if [ -f server_backup.7z.001 ]; then
            echo "Backup found — restoring server"
            7z x server_backup.7z.001 -oserver/ -y
            touch server/.restored
          else
            echo "No backup — fresh setup"
          fi

      - name: Download Server Software (First Run Only)
        run: |
          if [ ! -f server/.restored ]; then
            if [ ! -f server/server.jar ]; then
              URL=$(jq -r '.server_url' mc_config.json)
              curl -L -o server/server.jar "$URL"
            fi
          else
            echo "Skipping server.jar download (restored)"
          fi

      - name: Configure EULA (First Run Only)
        run: |
          if [ ! -f server/.restored ] && [ ! -f server/eula.txt ]; then
            echo "eula=true" > server/eula.txt
          else
            echo "Skipping EULA"
          fi

      - name: Download Mods / Plugins / Assets (First Run Only)
        run: |
          if [ ! -f server/.restored ]; then
            jq -c '.downloads[]' mc_config.json | while read -r item; do
              DIR=$(echo "$item" | jq -r '.dir')
              URL=$(echo "$item" | jq -r '.url')
              mkdir -p "server/$DIR"
              FILE=$(basename "${URL%%\?*}")
              TARGET="server/$DIR/$FILE"

              if [ ! -f "$TARGET" ]; then
                curl -L "$URL" -o "$TARGET"
              fi
            done
          else
            echo "Skipping downloads (server restored)"
          fi

      - name: Start Cloudflare Tunnel & Expose Port
        run: |
          cloudflared tunnel --url tcp://localhost:25565 > cloudflare.log 2>&1 &
          sleep 10
          cat cloudflare.log
          ADDRESS=$(grep -oE '[a-zA-Z0-9-]+\.trycloudflare\.com:[0-9]+' cloudflare.log | head -n 1)
          echo "Minecraft Address: $ADDRESS" > address.txt

      - name: Start File Browser & Localtunnel
        run: |
          filebrowser --root ./server --port 8080 --address 0.0.0.0 --noauth > fb.log 2>&1 &
          lt --port 8080 > lt.log 2>&1 &
          sleep 5
          cat lt.log
          URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.loca\.lt' lt.log | head -n 1)
          echo "File Browser: $URL" >> address.txt

      - name: Commit Addresses
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add address.txt
          git commit -m "update addresses [skip ci]" || true
          git push

      - name: Run Minecraft Server
        run: |
          cd server
          rm -f stop.flag

          trap "touch stop.flag; kill \$JAVA_PID" SIGINT SIGTERM

          while true; do
            java -Xmx6G -Xms6G -jar server.jar nogui &
            JAVA_PID=$!
            wait $JAVA_PID
            [ -f stop.flag ] && break
            sleep 5
          done

      - name: Save Server State
        if: always()
        run: |
          pkill cloudflared || true
          pkill lt || true
          pkill filebrowser || true
          pkill -f java || true

          git rm -f server_backup.7z.* || true
          7z a server_backup.7z server -v95m
          git add server_backup.7z.*
          git commit -m "save server state [skip ci]" || true
          git push
